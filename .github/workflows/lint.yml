name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.10

    - name: Install dependencies
      run: uv sync

    - name: Run pre-commit hooks
      run: uv run prek run --all-files --show-diff-on-failure

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.10", "3.13" ]
    env:
      # Tests that need a model run against each of these (see tests/conftest.py).
      SEDA_TEST_MODEL: atasoglu/seda-v0.2,atasoglu/seda-v0.2-tiny,atasoglu/seda-v0.1

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install ${{ matrix.python }}

    - name: Cache models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: hf-models-${{ hashFiles('src/sedalib/stt.py') }}
        restore-keys: hf-models-

    - name: Install dependencies
      run: uv sync --extra format --python ${{ matrix.python }}

    - name: Run tests
      run: uv run pytest -v
