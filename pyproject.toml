[project]
name = "sedalib"
dynamic = ["version"]
description = "Lightweight, low-latency Turkish speech models for real-time applications"
readme = "README.md"
authors = [
    { name = "atasoglu", email = "ahmetatasoglu98@gmail.com" }
]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["turkish", "speech-recognition", "stt", "streaming", "sherpa-onnx"]
dependencies = [
    "huggingface-hub>=2.1.1",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
]

[project.optional-dependencies]
demo = [
    "gradio>=6.29.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/sedalib"]

[dependency-groups]
dev = [
    "prek>=0.5.5",
    "ruff>=0.16.10",
]
examples = [
    "sounddevice>=0.5.6",
]
